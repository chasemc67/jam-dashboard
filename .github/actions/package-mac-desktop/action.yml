name: Package Mac desktop app
description: >-
  Test and package Jam Dashboard for Apple Silicon (arm64) and write the
  latest-mac.yml update feed. Signs and notarizes only when a complete set of
  credentials is passed in; otherwise builds unsigned.

inputs:
  csc-link:
    description: Base64 Developer ID Application .p12 (certificate + private key)
    default: ''
  csc-key-password:
    description: Password for the .p12
    default: ''
  apple-api-key-p8:
    description: Contents of the App Store Connect API key (AuthKey_XXXX.p8)
    default: ''
  apple-api-key-id:
    description: App Store Connect API key ID
    default: ''
  apple-api-issuer:
    description: App Store Connect API issuer ID
    default: ''
  apple-id:
    description: Apple ID email (alternative to the API key)
    default: ''
  apple-app-specific-password:
    description: App-specific password for the Apple ID
    default: ''
  apple-team-id:
    description: Apple Developer Team ID
    default: ''
  require-signing:
    description: Fail instead of building unsigned when credentials are missing
    default: 'false'

outputs:
  version:
    description: Version stamped into the app and its release artifacts
    value: ${{ steps.version.outputs.version }}
  signed:
    description: Whether the apps were Developer ID signed and notarized
    value: ${{ steps.signing.outputs.signed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run desktop:test
    - shell: bash
      run: npm run agent:test
    - shell: bash
      run: npm run typecheck
    - shell: bash
      run: npm run desktop:test:native
    - shell: bash
      run: npm test -- --runInBand
    - shell: bash
      run: npm run build

    # major.minor come from desktop/package.json; the run number makes every
    # build newer than the last without committing version bumps.
    - id: version
      name: Compute version
      shell: bash
      run: |
        node -e '
          const [major, minor] = require("./desktop/package.json").version.split(".");
          console.log(`version=${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`);
        ' >> "$GITHUB_OUTPUT"

    - id: signing
      name: Check signing credentials
      shell: bash
      env:
        CSC_LINK: ${{ inputs.csc-link }}
        APPLE_API_KEY_P8: ${{ inputs.apple-api-key-p8 }}
        APPLE_API_KEY_ID: ${{ inputs.apple-api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.apple-app-specific-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        REQUIRE_SIGNING: ${{ inputs.require-signing }}
      run: |
        set -euo pipefail
        count() { local n=0; for value in "$@"; do [ -n "$value" ] && n=$((n + 1)); done; echo "$n"; }
        api=$(count "$APPLE_API_KEY_P8" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER")
        apple_id=$(count "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID")
        if [ "$api" != 0 ] && [ "$api" != 3 ]; then
          echo "::error::Set all of APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER, or none."; exit 1
        fi
        if [ "$apple_id" != 0 ] && [ "$apple_id" != 3 ]; then
          echo "::error::Set all of APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID, or none."; exit 1
        fi
        notarize=false; { [ "$api" = 3 ] || [ "$apple_id" = 3 ]; } && notarize=true
        if [ -z "$CSC_LINK" ] && [ "$notarize" = false ]; then
          if [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::DESKTOP_REQUIRE_SIGNING is true but no signing secrets are available to this job."; exit 1
          fi
          echo "::warning::No Apple signing secrets: building an unsigned preview that cannot auto-update."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Gatekeeper blocks signed-but-unnotarized downloads, so require both.
        if [ -z "$CSC_LINK" ]; then echo "::error::Notarization secrets are set but CSC_LINK is missing."; exit 1; fi
        if [ "$notarize" = false ]; then
          echo "::error::CSC_LINK is set but notarization is not: add the App Store Connect API key secrets or the Apple ID secrets."; exit 1
        fi
        if [ "$api" = 3 ]; then
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          echo "api-key-path=$key" >> "$GITHUB_OUTPUT"
        fi
        echo "signed=true" >> "$GITHUB_OUTPUT"

    - name: Package arm64
      shell: bash
      env:
        JAM_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed }}
        CSC_LINK: ${{ steps.signing.outputs.signed == 'true' && inputs.csc-link || '' }}
        CSC_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && inputs.csc-key-password || '' }}
        APPLE_API_KEY: ${{ steps.signing.outputs.api-key-path }}
        APPLE_API_KEY_ID: ${{ steps.signing.outputs.api-key-path && inputs.apple-api-key-id || '' }}
        APPLE_API_ISSUER: ${{ steps.signing.outputs.api-key-path && inputs.apple-api-issuer || '' }}
        APPLE_ID: ${{ !steps.signing.outputs.api-key-path && inputs.apple-id || '' }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ !steps.signing.outputs.api-key-path && inputs.apple-app-specific-password || '' }}
        APPLE_TEAM_ID: ${{ !steps.signing.outputs.api-key-path && inputs.apple-team-id || '' }}
      run: npm run desktop:package -- --arm64

    - name: Verify update feed and signatures
      shell: bash
      run: >-
        node desktop/verify-release.mjs
        --version "${{ steps.version.outputs.version }}"
        --signed "${{ steps.signing.outputs.signed }}"

    - name: Remove API key
      if: always() && steps.signing.outputs.api-key-path
      shell: bash
      run: rm -f "${{ steps.signing.outputs.api-key-path }}"
