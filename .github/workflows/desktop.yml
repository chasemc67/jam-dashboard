name: Mac desktop app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'public/**'
      - 'desktop/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `desktop-v${require("./desktop/package.json").version}`) process.exit(1)'
      - run: npm run desktop:test
      - run: npm run desktop:test:native
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run desktop:package -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Jam-Dashboard-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create draft with Mac downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.dmg release/*.zip --draft --verify-tag \
            --title "Jam Dashboard $RELEASE_TAG" \
            --notes "Mac desktop preview for macOS 13+. Choose arm64 for Apple Silicon or x64 for Intel. Includes an integrated song analyzer tab; install yt-dlp and ffmpeg with Homebrew. These preview builds are not Developer ID signed or notarized."
